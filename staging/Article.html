<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article | The Angle Africa</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ffffff;
            --secondary: #f8f9fa;
            --accent: #6b272a;
            --accent-light: #8a3a3d;
            --dark: #121212;
            --text: #333333;
            --text-light: #666666;
            --border: #e0e0e0;
            --header-height: 70px;
            --max-width: 1120px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            line-height: 1.7;
            color: var(--text);
            background: var(--primary);
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .container,
        .article-container {
            width: 100%;
            margin: 0 auto;
            padding: 0 20px;
        }

        .container {
            max-width: var(--max-width);
        }

        header.site-header {
            background-color: var(--primary);
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.08);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: var(--header-height);
        }

        .logo img {
            height: 45px;
            width: auto;
            display: block;
        }

        nav ul {
            display: flex;
            gap: 30px;
            list-style: none;
        }

        nav a {
            font-weight: 500;
            transition: color 0.3s;
        }

        nav a:hover,
        nav a.active {
            color: var(--accent);
        }

        .mobile-menu-btn {
            display: none;
            border: 0;
            background: transparent;
            color: var(--dark);
            font-size: 24px;
            cursor: pointer;
        }

        .hero-section {
            position: relative;
            min-height: 600px;
            height: 75vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-position: center;
            background-size: cover;
            color: #ffffff;
            text-align: center;
        }

        .hero-content {
            width: min(900px, calc(100% - 40px));
            z-index: 2;
        }

        .hero-category,
        .article-kicker {
            display: inline-block;
            background-color: rgba(107, 39, 42, 0.9);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 30px;
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1.5px;
            margin-bottom: 30px;
            padding: 12px 30px;
            text-transform: uppercase;
        }

        .hero-title,
        [data-admin-article-detail] h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(32px, 6vw, 56px);
            font-weight: 800;
            line-height: 1.1;
            margin: 0 auto 25px;
            max-width: 920px;
            text-shadow: 0 3px 20px rgba(0, 0, 0, 0.7);
        }

        .hero-subtitle {
            font-size: 22px;
            font-weight: 400;
            line-height: 1.5;
            margin: 0 auto 30px;
            max-width: 780px;
            opacity: 0.95;
            text-shadow: 0 1px 10px rgba(0, 0, 0, 0.5);
        }

        .hero-meta {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 30px;
            font-size: 14px;
            opacity: 0.9;
        }

        .hero-author,
        .hero-date {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .article-section {
            padding: 80px 0;
            background: var(--primary);
        }

        .article-container,
        [data-admin-article-detail] > .article-container {
            max-width: 820px;
        }

        .article-intro {
            color: var(--text-light);
            font-size: 22px;
            line-height: 1.7;
            padding-bottom: 20px;
            margin-bottom: 32px;
            border-bottom: 2px solid var(--border);
        }

        .article-copy,
        .article-copy p {
            font-size: 18px;
            line-height: 1.8;
        }

        .article-copy p {
            margin-bottom: 24px;
        }

        .back-button,
        .article-back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 30px;
            padding: 8px 16px;
            border: 1px solid var(--accent);
            border-radius: 4px;
            color: var(--accent);
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .back-button:hover,
        .article-back-link:hover {
            background: var(--accent);
            color: #ffffff;
        }

        [data-admin-article-detail] > .article-container {
            padding-top: 90px;
            padding-bottom: 90px;
        }

        footer {
            background: var(--dark);
            color: #ffffff;
            padding: 34px 0;
        }

        .copyright {
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            text-align: center;
        }

        @media (max-width: 768px) {
            .mobile-menu-btn {
                display: block;
            }

            nav {
                position: fixed;
                top: var(--header-height);
                left: 0;
                width: 100%;
                background: var(--primary);
                padding: 20px;
                box-shadow: 0 10px 15px rgba(0, 0, 0, 0.08);
                transform: translateY(-120%);
                transition: transform 0.3s;
            }

            nav.active {
                transform: translateY(0);
            }

            nav ul {
                flex-direction: column;
                gap: 16px;
            }

            .hero-section {
                min-height: 420px;
                height: auto;
                padding: 90px 0 60px;
            }

            .hero-subtitle {
                font-size: 18px;
            }

            .article-section {
                padding: 48px 0;
            }

            .article-intro {
                font-size: 19px;
            }

            .article-copy p {
                font-size: 17px;
            }
        }

        @media (max-width: 576px) {
            .hero-meta {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="container header-container">
            <a href="index.html" class="logo" aria-label="The Angle Africa home">
                <img src="Logo-1-removebg-preview.png" alt="The Angle Africa">
            </a>
            <button class="mobile-menu-btn" id="mobile-menu-btn" type="button" aria-label="Toggle menu">
                <i class="fas fa-bars"></i>
            </button>
            <nav id="main-nav">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about-us.html">About Us</a></li>
                    <li><a href="Elections.html">Elections</a></li>
                    <li><a href="Perspectives.html">Perspectives</a></li>
                    <li><a href="Articles.html" class="active">Articles</a></li>
                    <li><a href="Podcast.html">Podcast</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main data-admin-article-detail>
        <div class="article-container">
            <p class="article-kicker">Loading</p>
            <h1>Opening article...</h1>
            <p class="article-intro">Please wait while the article loads.</p>
        </div>
    </main>

    <footer>
        <div class="container">
            <div class="copyright">&copy; 2024 The Angle Africa. All rights reserved.</div>
        </div>
    </footer>

    <script>
        const mobileMenuBtn = document.getElementById('mobile-menu-btn');
        const mainNav = document.getElementById('main-nav');

        mobileMenuBtn.addEventListener('click', function () {
            mainNav.classList.toggle('active');
            const icon = mobileMenuBtn.querySelector('i');
            icon.classList.toggle('fa-bars');
            icon.classList.toggle('fa-times');
        });
    </script>
    <script src="js/admin-content.js"></script>
</body>
</html>
